[project]
name = "tradelab"
version = "0.1.0"
description = "Backtest trading strategies described in plain language, from inside Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp>=2,<3", "pandas", "pyarrow", "plotly", "httpx", "pydantic>=2"]

[project.scripts]
tradelab = "tradelab.download:main"
tradelab-mcp = "tradelab.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
